<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>STAR Nominations – Monthly PDF</title>
<style>
  :root { --navy:#17324d; --gold:#e6a800; --muted:#5d6875; --line:#d9dde3; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 "Segoe UI", Arial, sans-serif; color:#1c2430; background:#f4f2ec; }
  header { background:var(--navy); color:#fff; border-bottom:4px solid var(--gold); padding:14px 18px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; opacity:.8; font-size:13px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--navy); margin:0 0 10px; }
  .month { display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
           font:inherit; padding:12px 14px; margin:0 0 8px; border:1px solid #c4cad2; border-radius:10px; background:#fff; cursor:pointer; }
  .month:hover { border-color:var(--gold); }
  .month.sel { border:2px solid var(--gold); background:#fff8e1; }
  .month small { color:var(--muted); }
  .badge { background:var(--navy); color:#fff; border-radius:999px; padding:2px 10px; font-size:13px; font-weight:600; }
  label.chk { display:flex; gap:8px; align-items:center; margin:6px 0 12px; font-size:14px; }
  button.go { width:100%; font:inherit; font-weight:700; padding:13px; border:0; border-radius:10px; background:var(--navy); color:#fff; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:default; }
  .bar { height:8px; background:#e7e9ec; border-radius:6px; overflow:hidden; margin-top:12px; display:none; }
  .bar div { height:100%; width:0; background:var(--gold); transition:width .2s; }
  #status { font-size:13px; color:var(--muted); margin-top:8px; min-height:20px; }
  #result a { display:block; text-align:center; margin-top:10px; padding:12px; border-radius:10px; background:var(--gold);
              color:var(--navy); font-weight:700; text-decoration:none; }
  .err { color:#b3261e; }
  .hidden { display:none; }
  .or { text-align:center; color:var(--muted); font-size:13px; margin:14px 0 8px; }
  #emailTo { width:100%; font:inherit; padding:12px; border:1px solid #c4cad2; border-radius:10px; margin:0 0 10px; }
  button.go.alt { background:#fff; color:var(--navy); border:2px solid var(--navy); }
  #pin { width:100%; font:inherit; font-size:18px; padding:12px; border:1px solid #c4cad2; border-radius:10px; margin:0 0 10px; letter-spacing:2px; }
  #pinMsg { font-size:13px; min-height:20px; margin-top:8px; }
  .lock { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; float:right; }
</style>
</head>
<body>
<header>
  <h1>STAR Nominations – Monthly PDF</h1>
  <p>Administrator download</p>
</header>
<main>
  <form class="card" id="pinCard">
    <h2>Admin PIN</h2>
    <input id="pin" type="password" inputmode="text" autocomplete="current-password" placeholder="Enter PIN" required>
    <button class="go" id="pinGo" type="submit">Unlock</button>
    <div id="pinMsg"></div>
  </form>
  <div id="app" class="hidden">
  <div class="card">
    <button class="lock" id="lock" type="button">Lock</button>
    <h2>1. Choose a month</h2>
    <div id="months">Loading…</div>
  </div>
  <div class="card">
    <h2>2. Download or e-mail</h2>
    <label class="chk"><input type="checkbox" id="summary" checked> Add a summary page at the front</label>
    <button class="go" id="go" disabled>Select a month first</button>
    <div class="or">or e-mail it</div>
    <input id="emailTo" type="email" inputmode="email" autocomplete="email" multiple
           placeholder="name@example.com (separate several with commas)">
    <button class="go alt" id="send" disabled>E-mail PDF</button>
    <div class="bar" id="bar"><div></div></div>
    <div id="status"></div>
    <div id="result"></div>
  </div>
  <div class="card">
    <h2>Staff list</h2>
    <p style="margin:0 0 10px;font-size:14px;color:var(--muted)">After editing "Copy of W19 Staff List" in Google Drive, tap this
      to update the names in the nomination form.</p>
    <button class="go alt" id="staff">Refresh staff names</button>
    <div id="staffMsg" style="font-size:13px;margin-top:8px;min-height:20px"></div>
  </div>
  </div>
</main>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
/* Builds one PDF: optional summary page + every nomination PDF in order. */
async function buildMonthPdf(PDFLib, monthLabel, items, pdfBytesList, withSummary) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const out = await PDFDocument.create();
  if (withSummary) {
    const font = await out.embedFont(StandardFonts.Helvetica);
    const bold = await out.embedFont(StandardFonts.HelveticaBold);
    const ok = new Set(font.getCharacterSet());
    const clean = s => String(s || '').split('').map(c => ok.has(c.codePointAt(0)) ? c : '?').join('');
    const fit = (s, f, size, w) => { s = clean(s); while (s && f.widthOfTextAtSize(s, size) > w) s = s.slice(0, -1); return s; };
    const navy = rgb(0.09, 0.2, 0.3);
    const cols = [{ t: '#', x: 50, w: 22 }, { t: 'Submitted', x: 76, w: 64 }, { t: 'Nominee', x: 144, w: 140 },
                  { t: 'Badge', x: 288, w: 60 }, { t: 'Unit/Ward', x: 352, w: 90 }, { t: 'Nominator', x: 446, w: 100 }];
    let page, y;
    const newPage = first => {
      page = out.addPage([595.28, 841.89]); y = 790;
      if (first) {
        page.drawText('STAR Program Nominations', { x: 50, y, size: 18, font: bold, color: navy }); y -= 22;
        page.drawText(clean(monthLabel) + '  -  ' + items.length + ' nomination' + (items.length === 1 ? '' : 's'),
                      { x: 50, y, size: 12, font, color: navy }); y -= 28;
      }
      cols.forEach(c => page.drawText(c.t, { x: c.x, y, size: 9.5, font: bold, color: navy }));
      y -= 6; page.drawLine({ start: { x: 50, y }, end: { x: 546, y }, thickness: 1, color: navy }); y -= 14;
    };
    newPage(true);
    items.forEach((it, i) => {
      if (y < 60) newPage(false);
      const vals = [String(i + 1), it.submitted, it.nominee, it.badge, it.unit, it.nominator];
      cols.forEach((c, k) => page.drawText(fit(vals[k], font, 9.5, c.w), { x: c.x, y, size: 9.5, font }));
      y -= 16;
    });
  }
  for (const bytes of pdfBytesList) {
    const src = await PDFDocument.load(bytes);
    const pages = await out.copyPages(src, src.getPageIndices());
    pages.forEach(p => out.addPage(p));
  }
  out.setTitle('STAR Nominations - ' + monthLabel);
  return out.save();
}
</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let months = [], selected = null, lastUrl = null;
  let pin = "";
  // Apps Script web app (Execute as: Me, Access: Anyone). Requests carry no cookies,
  // so it works in any browser whatever Google accounts are signed in.
  const API = "https://script.google.com/macros/s/AKfycbxj4SXSDXW8gmJZFAc0n0gsTt_z_5se9qfFsMCJrkDCPYVmSts9E1gke9crVm-Pe5IR/exec";
  const call = async (fn, pinArg, ...args) => {
    let r;
    try {
      r = await fetch(API, { method: "POST", credentials: "omit", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ fn, pin: pinArg, args }) });
    } catch (e) { throw new Error("Could not reach the server. Check your internet connection."); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error("The server gave an unexpected answer (" + r.status + ")."); }
    if (!j.ok) throw new Error(j.error || "Request failed.");
    return j.data;
  };
  const b64ToBytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const setStatus = (msg, isErr) => { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; };

  function render() {
    if (!months.length) { $('months').textContent = 'No nominations yet.'; return; }
    $('months').innerHTML = '';
    months.forEach(m => {
      const b = document.createElement('button');
      b.className = 'month' + (selected && selected.key === m.key ? ' sel' : '');
      b.innerHTML = '<span><strong>' + m.label + '</strong>' +
        (m.ready < m.count ? '<br><small>' + (m.count - m.ready) + ' not yet converted to PDF</small>' : '') +
        '</span><span class="badge">' + m.ready + '</span>';
      b.onclick = () => { selected = m; render(); updateButton(); };
      $('months').appendChild(b);
    });
  }

  const bytesToB64 = bytes => {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const plural = n => n + ' nomination' + (n === 1 ? '' : 's');
  try { $('emailTo').value = localStorage.getItem('starEmailTo') || ''; } catch (e) {}

  function updateButton() {
    const go = $('go'), send = $('send');
    const ok = !!(selected && selected.ready);
    go.disabled = send.disabled = !ok;
    go.textContent = !selected ? 'Select a month first'
      : !selected.ready ? 'No PDFs for this month yet'
      : 'Download ' + selected.label + ' (' + selected.ready + ' PDF' + (selected.ready === 1 ? '' : 's') + ')';
    send.textContent = ok ? 'E-mail ' + selected.label + ' PDF' : 'E-mail PDF';
    $('result').innerHTML = '';
  }

  /** Fetches every nomination PDF for month m and combines them. */
  async function buildFor(m) {
    $('bar').style.display = 'block'; const fill = $('bar').firstElementChild; fill.style.width = '0';
    setStatus('Reading the list…');
    const items = (await call('getMonth', pin, m.key)).filter(it => it.id);
    if (!items.length) throw new Error('No PDFs for this month yet.');
    const bytes = new Array(items.length); let done = 0;
    const queue = items.map((it, i) => i);
    const worker = async () => {
      while (queue.length) {
        const i = queue.shift();
        bytes[i] = b64ToBytes(await call('getPdf', pin, items[i].id));
        done++; fill.style.width = (done / items.length * 80) + '%';
        setStatus('Fetching PDFs… ' + done + ' / ' + items.length);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    setStatus('Combining into one PDF…');
    const out = await buildMonthPdf(PDFLib, m.label, items, bytes, $('summary').checked);
    fill.style.width = '90%';
    return { out, items, name: 'STAR_Nominations_' + m.key + '.pdf', fill };
  }

  const busy = on => { $('go').disabled = $('send').disabled = on; };

  $('go').onclick = async () => {
    const m = selected; if (!m) return;
    busy(true); $('result').innerHTML = '';
    try {
      const { out, items, name, fill } = await buildFor(m);
      fill.style.width = '100%';
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([out], { type: 'application/pdf' }));
      const a = document.createElement('a');
      a.href = lastUrl; a.download = name; a.target = '_blank';
      a.textContent = 'Save ' + name;
      $('result').appendChild(a);
      a.click();
      setStatus('Done – ' + plural(items.length) + '. If the download did not start, tap the button above.');
    } catch (e) {
      setStatus('Something went wrong: ' + (e && e.message ? e.message : e), true);
    } finally {
      busy(false);
    }
  };

  $('send').onclick = async () => {
    const m = selected; if (!m) return;
    const to = $('emailTo').value.trim();
    const list = to.split(/[\s,;]+/).filter(Boolean);
    if (!list.length) { setStatus('Enter the e-mail address to send to.', true); $('emailTo').focus(); return; }
    const bad = list.filter(a => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a));
    if (bad.length) { setStatus('Not a valid e-mail address: ' + bad.join(', '), true); $('emailTo').focus(); return; }
    busy(true); $('result').innerHTML = '';
    try {
      const { out, items, name, fill } = await buildFor(m);
      setStatus('Sending e-mail…');
      const sent = await call('emailPdf', pin, list.join(','), m.label, name, bytesToB64(out), items.length);
      fill.style.width = '100%';
      try { localStorage.setItem('starEmailTo', list.join(', ')); } catch (e) {}
      setStatus('E-mailed ' + m.label + ' (' + plural(items.length) + ') to ' + sent.join(', ') + '.');
    } catch (e) {
      setStatus('Could not send: ' + (e && e.message ? e.message : e), true);
    } finally {
      busy(false);
    }
  };

  $('staff').onclick = async () => {
    const b = $('staff'), out = $('staffMsg');
    b.disabled = true; out.className = ''; out.textContent = 'Updating the form…';
    try {
      const n = await call('refreshStaff', pin);
      out.textContent = 'Done – the form now lists ' + n + ' staff names.';
    } catch (e) {
      out.className = 'err'; out.textContent = 'Could not update: ' + (e && e.message ? e.message : e);
    } finally { b.disabled = false; }
  };

  const showPin = msg => {
    $('app').classList.add('hidden'); $('pinCard').classList.remove('hidden');
    $('pinMsg').textContent = msg || ''; $('pinMsg').className = msg ? 'err' : '';
    $('pinGo').disabled = false; $('pin').focus();
  };
  const unlock = () => {
    $('pinGo').disabled = true; $('pinMsg').className = ''; $('pinMsg').textContent = 'Checking…';
    call('getMonths', pin).then(m => {

      months = m; selected = null; render(); updateButton();
      $('pinCard').classList.add('hidden'); $('app').classList.remove('hidden');
    }).catch(e => { pin = ''; showPin(e.message || String(e)); });
  };
  $('pinCard').onsubmit = ev => { ev.preventDefault(); pin = $('pin').value.trim(); if (pin) unlock(); };
  $('lock').onclick = () => { pin = ''; $('pin').value = ''; showPin(); };
  showPin();
})();
</script>
</body>
</html>
